<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>pi mobile</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./src/app.css" />
</head>
<body>
  <div id="app" aria-busy="true">
    <header class="status">
      <span id="dot" class="dot"></span><span id="stxt">connecting</span>
      <span class="spacer"></span><button id="refresh" type="button">reload</button>
    </header>
    <main id="list" class="list"></main>
    <section class="detail">
      <div class="bar">
        <button id="back" class="icon" type="button" aria-label="Back to sessions">&#8592;</button>
        <span class="title" id="dtitle"></span>
        <button id="stop" class="icon stop" type="button" aria-label="Stop this session">&#9632;</button>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <form class="composer" onsubmit="return false">
        <textarea id="ta" rows="1" placeholder="Message this session"
                  enterkeyhint="send" autocapitalize="sentences"></textarea>
        <button id="send" class="send" type="button">Send</button>
      </form>
    </section>
  </div>
  <script>document.getElementById("refresh").onclick=()=>location.reload();</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
