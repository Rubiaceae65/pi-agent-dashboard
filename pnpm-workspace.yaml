# pnpm workspace configuration (change: adopt-pnpm-for-dev-ci).
# nodeLinker:hoisted is MANDATORY — electron-forge hard-fails otherwise
# ("When using pnpm, node-linker must be set to 'hoisted'"). Hoisted also
# flattens node_modules so third-party phantom deps resolve npm-like; the
# 8 workspace phantom-dep edges are still declared explicitly in package.json.
packages:
  - 'packages/*'

# Flat node_modules (npm-like). Required by electron-forge preflight.
nodeLinker: hoisted

# Do not gate `pnpm run` on a deps-status check — avoids the
# runDepsStatusCheck/execaCoreSync crash under this monorepo layout.
verifyDepsBeforeRun: false

# Allow transitive git/exotic subdeps (e.g. @electron/node-gyp via HTTPS
# codeload). Replaces the fragile npm@11.12.1 EALLOWGIT pin. Active key —
# removing it makes `pnpm install` fail with ERR_PNPM_EXOTIC_SUBDEP.
blockExoticSubdeps: false

# Prefer/link local workspace packages over the registry even when the
# local version is ahead of the published one.
linkWorkspacePackages: true
preferWorkspacePackages: true

# Non-interactive: never prompt to purge node_modules on linker change.
confirmModulesPurge: false

# Pin bonjour-service to 1.4.2 (the version develop's package-lock.json
# resolved). 1.4.3 is a bad patch that re-exports Service/Browser as namespace
# consts (values) instead of types, breaking `import { type Service }` in
# packages/shared/src/mdns-discovery.ts. See change: adopt-pnpm-for-dev-ci.
overrides:
  bonjour-service: 1.4.2
  # ONE pi version in the tree. Several workspaces declare a deliberately broad
  # `>=0.80.10` peer/dev range while `packages/server` pins the governed
  # `^0.85.1`; under `nodeLinker: hoisted` that resolves TWO copies (0.85.1
  # nested for the server, an older one hoisted to the root). `/api/health`'s
  # version probe then reports the HOISTED copy, so the dashboard claimed to be
  # running a pi it was not and raised a spurious `upgradeRecommended`.
  # Pre-0.84 both copies happened to agree, which masked it.
  #
  # This pins RESOLUTION. From 0.85.1 the override is a GOVERNED pin: the
  # coherence gate in scripts/verify-release-deps.mjs compares it against the
  # server dep, piCompatibility.minimum/.recommended, the Dockerfile install
  # and the checker's own minVersion (design §9 — the broad peer ranges stay
  # untouched, so this override is permanently necessary).
  # Caught by the docker harness, not by any unit test.
  # See change: update-pi-core-0-85-adopt-apis.
  "@earendil-works/pi-coding-agent": 0.86.1
  # Security floor (2026-10-23, trivy 0.76.0 on rubiaceae65/pi-dashboard:dev-3,
  # fixable CRITICAL/HIGH). Each selector stays inside the resolved major.
  # form-data 2.5.6 goes past the parent's declared range (request@2.88.2
  # wants ~2.3.2). Drop an entry once the lockfile resolves the fixed version
  # itself. nodemailer (GHSA-v53p-9fqp-m79j, fixed 10.0.6) is fixed by the
  # mailparser 3.10.0 bump in packages/server (pins nodemailer 10.1.7), which
  # also brings html-to-text 10.0.1 -> deepmerge-ts 8 (CVE-2026-40345).
  # 2026-10-24, trivy on pi-dashboard:dev-6 (Node HIGH):
  # - basic-ftp 5.3.1 -> 6.2.1 (CVE-2026-102990) is the ONE cross-major entry:
  #   get-uri@6 (proxy-agent -> pac-proxy-agent, ftp:// PAC URLs) wants ^5.3.1
  #   and no 5.x fix exists. 6.0.0's only break is allowSeparateTransferHost
  #   defaulting to false; the Client API get-uri calls (access/lastMod/list/
  #   downloadTo/close) is unchanged and the package stays CJS.
  # - @modelcontextprotocol/client 2.0.0 -> 2.2.0 (CVE-2026-104850):
  #   pi-mcp-adapter@2.30.0 pins client+core 2.0.0 exactly; client 2.2.0 pins
  #   core 2.2.0, so core moves with it to keep ONE core copy.
  "undici@6": 6.28.1
  "undici@7": 7.29.1
  "brace-expansion@1": 1.1.20
  "brace-expansion@2": 2.1.6
  "brace-expansion@5": 5.0.11
  "@xmldom/xmldom@0.9": 0.9.12
  "fastify@5": 5.12.2
  "fast-uri@3": 3.1.7
  "fast-uri@4": 4.1.4
  "form-data@2": 2.5.6
  "handlebars@4": 4.7.10
  "proxy-addr@2": 2.0.8
  "source-map-js@1": 1.2.2
  "basic-ftp@5": 6.2.1
  "@modelcontextprotocol/sdk@1": 1.31.0
  "@modelcontextprotocol/client@2": 2.2.0
  "@modelcontextprotocol/core@2": 2.2.0

# pnpm 11 treats un-approved dependency build scripts as a FATAL error
# (ERR_PNPM_IGNORED_BUILDS, non-zero exit) — which would red every CI
# `pnpm install --frozen-lockfile`. `onlyBuiltDependencies` proved unreliable
# here (design §D5: allow-listed scripts stay ignored anyway), so instead we
# demote the ignored-builds gate to a non-fatal warning and rebuild the
# natives we actually need on the paths that need them: `_electron-build.yml`
# runs `pnpm rebuild node-pty` + electron `node install.js`; `bundle-server.mjs`
# runs its own npm install for the bundle's node_modules. node-pty/esbuild/sharp
# ship prebuilt binaries (or platform optionalDependencies), so the dev/CI tree
# works without their install scripts.
strictDepBuilds: false

# Acknowledge the known build-script deps so the warning stays quiet. A NEW
# build-script dep still surfaces (as a warning, non-fatal) — a review nudge.
ignoredBuiltDependencies:
  - '@fission-ai/openspec'
  - '@google/genai'
  - electron
  - esbuild
  - fs-xattr
  - koffi
  - macos-alias
  - node-pty
  - phantomjs-prebuilt
  - protobufjs
  - sharp

allowBuilds:
  # ffmpeg-static downloads its binary via `install: node install.js`;
  # @ffprobe-installer platform packages ship the binary 0644 and
  # `postinstall: chmod u+x ffprobe`. Without these the static-npm
  # strategy resolves a dead/never-downloaded path.
  # See change: add-skill-tool-provisioning.
  'ffmpeg-static': true
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-ia32': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-ia32': true
  '@ffprobe-installer/win32-x64': true
  '@fission-ai/openspec': true
  '@google/genai': true
  electron: true
  esbuild: true
  fs-xattr: true
  koffi: true
  macos-alias: true
  node-pty: true
  phantomjs-prebuilt: false
  protobufjs: true
  sharp: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.83.0 || 0.84.1'
  - '@earendil-works/pi-ai@0.83.0 || 0.84.1 || 0.86.1'
  - '@earendil-works/pi-coding-agent@0.83.0 || 0.84.1'
  - '@earendil-works/pi-tui@0.83.0 || 0.84.1'
  - pi-mcp-adapter@2.19.0
  - '@earendil-works/pi-client@0.84.1'
  - '@earendil-works/pi-protocol@0.84.1'
  - '@earendil-works/pi-telemetry@0.84.1 || 0.86.1'
