<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links</title>
<style>
:root{color-scheme:light dark;
 --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink2:#46453f;
 --grid:#e1e0d9; --accent:#1f62b4;}
@media (prefers-color-scheme:dark){:root{
 --surface:#1a1a19; --plane:#0d0d0d; --ink:#fff; --ink2:#c3c2b7;
 --grid:#2c2c2a; --accent:#7fb2f0;}}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
 font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--grid);padding:12px 16px}
h1{font-size:16px;margin:0;font-weight:600}
main{padding:12px 16px;max-width:960px}
h2{margin:16px 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;
 letter-spacing:.07em;color:var(--ink2)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;
 grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
li{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:10px 12px}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover,a:focus{text-decoration:underline}
.url{display:block;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink2);
 overflow-wrap:anywhere;margin-top:2px}
.note{margin-top:4px;color:var(--ink2);font-size:12.5px}
.state{color:var(--ink2);padding:24px 0}
</style></head>
<body>
<header><h1>Links</h1></header>
<main id="main" aria-busy="true"><p class="state" id="state">Loading…</p></main>
<script>
// The links come from the deployment (PI_DASHBOARD_LINKS_FILE, served by the
// dashboard at ./links.json). This page carries no addresses of its own, and
// with nothing configured it says so. Every string from the config is
// rendered as TEXT (textContent), and only https URLs are made into links.
(function () {
  const main = document.getElementById('main');
  const state = document.getElementById('state');
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  function safeHref(raw) {
    try {
      const u = new URL(raw);
      return u.protocol === 'https:' && !u.username && !u.password ? u.href : null;
    } catch (e) { return null; }
  }
  function show(msg) { state.textContent = msg; main.setAttribute('aria-busy', 'false'); }
  function render(data) {
    const links = Array.isArray(data && data.links) ? data.links : [];
    if (!data || data.configured !== true) {
      return show('Links are not configured on this deployment (set PI_DASHBOARD_LINKS_FILE).');
    }
    if (data.error) return show('The configured links file could not be used (' + data.error + ').');
    const groups = new Map();
    for (const l of links) {
      const href = safeHref(l && l.url);
      if (!href || typeof l.label !== 'string') continue;
      const g = typeof l.group === 'string' ? l.group : '';
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push({ label: l.label, href, note: typeof l.note === 'string' ? l.note : '' });
    }
    if (groups.size === 0) return show('No links are configured on this deployment.');
    state.remove();
    for (const [g, items] of groups) {
      if (g) main.appendChild(el('h2', null, g));
      const ul = el('ul');
      for (const it of items) {
        const li = el('li');
        const a = el('a', null, it.label);
        a.href = it.href;
        a.rel = 'noreferrer';
        li.appendChild(a);
        li.appendChild(el('span', 'url', it.href));
        if (it.note) li.appendChild(el('div', 'note', it.note));
        ul.appendChild(li);
      }
      main.appendChild(ul);
    }
    main.setAttribute('aria-busy', 'false');
  }
  fetch('./links.json', { cache: 'no-store', credentials: 'same-origin' })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then(render)
    .catch(() => show('Could not load the links.'));
})();
</script>
</body></html>
