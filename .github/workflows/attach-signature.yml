# Attach a cosign signature that was produced ELSEWHERE.
#
# The signature and its payload are generated on brain2 by release/lib/keycustody.py +
# signing.sign_blob, with the PRIVATE key, which never leaves brain2 and is not in this
# repository or any secret here. What crosses is public data: the signature bytes and the
# payload they cover, base64'd into the dispatch inputs. GITHUB_TOKEN does the one
# privileged thing, which is the registry write an App installation token cannot do.

name: attach-signature

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image reference INCLUDING @sha256:<digest>'
        required: true
      signature_b64:
        description: 'base64 of the cosign signature (.sig)'
        required: true
      payload_b64:
        description: 'base64 of the cosign payload (.json)'
        required: true
      certificate_b64:
        description: 'base64 of the cosign certificate, if any (optional)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - id: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - name: Materialise the public signature material
        run: |
          set -euo pipefail
          mkdir -p sig
          printf '%s' '${{ inputs.signature_b64 }}' | base64 -d > sig/attachment.sig
          printf '%s' '${{ inputs.payload_b64 }}'   | base64 -d > sig/attachment.json
          if [ -n '${{ inputs.certificate_b64 }}' ]; then
            printf '%s' '${{ inputs.certificate_b64 }}' | base64 -d > sig/attachment.crt
          fi
          ls -l sig
          cat sig/attachment.json

      - name: Attach it to the image
        run: |
          set -euo pipefail
          ARGS="--signature sig/attachment.sig --payload sig/attachment.json"
          if [ -f sig/attachment.crt ]; then ARGS="$ARGS --certificate sig/attachment.crt"; fi
          cosign attach signature $ARGS '${{ inputs.image }}'
          echo "attached to ${{ inputs.image }}"
